# Every persona reviews the pull request independently, then a deterministic
# merge compiles one report into the job summary.
#
# Copy this file to .github/workflows/eval-review.yml in the repo you want
# reviewed. It runs in local mode — an Actions runner is already a disposable
# VM, so a container inside it would only add an image build to every run — and
# takes its credentials from the environment, which is where CI keeps them.
#
# Before the first run, add the secrets and variables the steps below
# reference: Settings → Secrets and variables → Actions.
name: eval-review

on:
  pull_request:
  workflow_dispatch:

# A stale review of an older push is worse than no review.
concurrency:
  group: eval-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The review is posted with the job's own GITHUB_TOKEN.
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Pull requests from forks get no secrets, so the run could only fail.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          # Personas review `git diff <base>...HEAD`, which needs both sides.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Whichever CLI eval-reviewer.config.ts names in agent.provider:
      #   pi          → @earendil-works/pi-coding-agent
      #   claude-code → @anthropic-ai/claude-code
      #   codex       → @openai/codex
      - name: Install the agent CLI
        run: npm install -g @earendil-works/pi-coding-agent

      # pi resolves "provider/model" against its own registry, which does not
      # exist on a fresh runner. This recreates the one entry the review needs.
      # The key stays a $VAR reference, so it is never written to disk.
      # Delete this step for claude-code or codex.
      - name: Point pi at the review endpoint
        env:
          BASE_URL: ${{ vars.EVAL_BASE_URL }}
          MODEL_ID: ${{ vars.EVAL_MODEL_ID }}
        run: |
          mkdir -p ~/.pi/agent
          cat > ~/.pi/agent/models.json <<JSON
          {
            "providers": {
              "review": {
                "baseUrl": "$BASE_URL",
                "api": "openai-completions",
                "apiKey": "\$OPENAI_API_KEY",
                "models": [{ "id": "$MODEL_ID" }]
              }
            }
          }
          JSON

      - name: Install eval-reviewer
        run: git clone --depth 1 https://github.com/alysonvilela/skills.git "$RUNNER_TEMP/skills"

      # The diff is written to a file so the review and the PR comment anchor
      # against the same bytes. Regenerating it between the two steps is how a
      # comment ends up pointing at a line that moved.
      #
      # Add pathspec exclusions for anything generated — a build output
      # directory is most of the diff and none of the review:
      #   ':(exclude)**/dist/**' ':(exclude)**/.output/**'
      - name: Build the review target
        run: |
          git diff "origin/${{ github.base_ref || github.event.repository.default_branch }}...HEAD" \
            > "$RUNNER_TEMP/target.diff"
          wc -l < "$RUNNER_TEMP/target.diff"

      # The runner exports the credential and local mode inherits this shell,
      # so nothing else has to be wired up. The repo's eval-reviewer.config.ts
      # decides the agent, the model, the personas, and the gate — set
      # agent.model to "review/<EVAL_MODEL_ID>" to match the step above.
      - name: Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node "$RUNNER_TEMP/skills/skills/engineering/eval-reviewer/scripts/review.ts" \
            --repo "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/target.diff"

      # Findings that name a line inside the diff become inline comments; the
      # rest go in the review body. Anchors are validated first — GitHub rejects
      # the whole review with 422 if one comment points outside the diff, so a
      # single bad line number would cost every finding.
      #
      # `always()` because the review step exits non-zero at review.failOn, and
      # a gate that blocks its own explanation is not much of a gate.
      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node "$RUNNER_TEMP/skills/skills/engineering/eval-reviewer/scripts/pr-comment.ts" \
            --verdict "$GITHUB_WORKSPACE/.eval-reviewer/verdict.json" \
            --diff "$RUNNER_TEMP/target.diff" \
            --pr "${{ github.event.number }}"

      # The report is on the run's summary page either way; this keeps the
      # per-persona transcripts around for when a persona misbehaves.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-review
          path: .eval-reviewer/
          retention-days: 14

      # For one plain comment carrying the whole report instead of an anchored
      # review, drop the step above and use:
      #
      #   gh pr comment "${{ github.event.number }}" \
      #     --body-file .eval-reviewer/report.md
      #
      # Any other sink is the same shape — verdict.json carries the findings,
      # so nothing downstream has to parse the markdown:
      #
      #   curl -X POST "$WEBHOOK" -d @.eval-reviewer/verdict.json
      #   jq -e '.breakdown.critical == 0' .eval-reviewer/verdict.json
