# eval-reviewer configuration
#
# Everything the orchestrator needs to know that isn't a persona prompt.
# Edit this file to change which agent reviews, where it runs, and how the
# findings are weighted — no changes to scripts/orchestrator.ts required.

# ─── Agent ───────────────────────────────────────────────────────────────────
# Which coding agent runs each persona. Sandcastle also ships claudeCode,
# codex, cursor, opencode, and copilot providers; only `pi` is wired up in
# scripts/orchestrator.ts today. Adding another is one entry in AGENTS there.
agent:
  provider: pi
  # pi resolves "provider/id" against its own model registry, so this selects
  # both the endpoint and the model. See "OpenAI-compatible APIs" below.
  model: claude-sonnet-4-6
  # Reasoning effort, passed to pi's --thinking flag.
  # off | minimal | low | medium | high | xhigh
  thinking: medium
  # Environment variables forwarded from your shell into every persona's
  # container. Names only — the values are read at run time, so no credential
  # is ever written into this file. A name listed here that isn't set in your
  # environment aborts the run before any container starts.
  forwardEnv: []
  # forwardEnv:
  #   - OPENAI_API_KEY

# ─── Sandbox ─────────────────────────────────────────────────────────────────
# Where each persona runs. Sandcastle ships docker, podman, vercel, and
# no-sandbox providers; only `docker` is wired up today.
#
# Build the image once before the first run:
#   npx @ai-hero/sandcastle init
sandbox:
  provider: docker
  imageName: sandcastle:eval-reviewer
  # Host paths bind-mounted into each container. `hostPath` accepts absolute,
  # `~`-relative, and cwd-relative paths; `~` in `sandboxPath` expands to the
  # container's home directory.
  mounts: []
  # mounts:
  #   - hostPath: ~/.pi/agent/models.json
  #     sandboxPath: ~/.pi/agent/models.json
  #     readonly: true

# ─── OpenAI-compatible APIs ──────────────────────────────────────────────────
# pi reaches any OpenAI-compatible endpoint through a custom provider in its
# own models.json. Three pieces have to line up:
#
# 1. Define the provider on the host, in ~/.pi/agent/models.json. The apiKey
#    field is resolved by pi and understands "$VAR" / "${VAR}" env references
#    and "!command" shell lookups — keep the literal key out of the file:
#
#      {
#        "providers": {
#          "my-api": {
#            "baseUrl": "https://api.example.com/v1",
#            "api": "openai-completions",
#            "apiKey": "$OPENAI_API_KEY",
#            "models": [
#              {
#                "id": "my-model",
#                "name": "My Model",
#                "reasoning": false,
#                "input": ["text"],
#                "contextWindow": 128000,
#                "maxTokens": 8192,
#                "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 }
#              }
#            ]
#          }
#        }
#      }
#
# 2. Mount that models.json into the container (sandbox.mounts above) so the
#    sandboxed pi sees the same provider definition your host pi does.
#
# 3. Forward the key the file refers to (agent.forwardEnv above), and point
#    agent.model at "my-api/my-model".
#
# The key is passed to the container as an environment variable at launch and
# is never written to disk by this skill.

# ─── Review ──────────────────────────────────────────────────────────────────
review:
  # Personas running at once. Each is a container running a full agent, so
  # this is a memory/CPU ceiling, not a rate limit.
  maxConcurrent: 3

  # Seconds without any agent output before the run is declared stuck.
  idleTimeoutSeconds: 600

  # Grace window after the agent emits its answer but before its process
  # exits — covers child processes holding stdout open.
  completionTimeoutSeconds: 60

  # Re-asks when a persona's output fails schema validation. Each retry
  # resumes that persona's session, so it re-emits without redoing the review.
  maxRetries: 2

  # Each persona reviews on its own git branch, in its own worktree, so
  # concurrent personas never share a working directory.
  branchPrefix: eval-review/

# ─── Personas ────────────────────────────────────────────────────────────────
# `name` must match a file in this directory: <name>.md is the persona prompt.
#
# `critical: true` means the review is not trustworthy without this persona —
# if one of them fails, the verdict is INCOMPLETE no matter what the others
# found. A clean PASS that silently skipped the security review is a lie.
personas:
  - name: skeptic
    critical: true
  - name: architect
    critical: true
  - name: security
    critical: true
  - name: minimalist
    critical: false
  - name: performance
    critical: false
  - name: test-coverage
    critical: false
